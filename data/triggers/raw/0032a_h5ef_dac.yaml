# RM0517 (STM32H5E4/H5E5/H5F4/H5F5) Table 314 "DAC interconnection"
# match: ^STM32H5[EF].*:DAC.*

- match: '^STM32H5[EF].*:DAC.*'
  triggers:
    - signal: DAC_CHX_TRG1
      source: TIM1_TRGO
    - signal: DAC_CHX_TRG2
      source: TIM2_TRGO
    - signal: DAC_CHX_TRG3
      source: TIM4_TRGO
    - signal: DAC_CHX_TRG4
      source: TIM5_TRGO
    - signal: DAC_CHX_TRG5
      source: TIM6_TRGO
    - signal: DAC_CHX_TRG6
      source: TIM7_TRGO
    - signal: DAC_CHX_TRG7
      source: TIM8_TRGO
    - signal: DAC_CHX_TRG8
      source: TIM15_TRGO
    - signal: DAC_CHX_TRG11
      source: LPTIM1_CH1
    - signal: DAC_CHX_TRG12
      source: LPTIM2_CH1
    - signal: DAC_CHX_TRG13
      source: EXTI9_TRG
    - signal: DAC_CHX_TRG14
      source: PLAY1_OUT11
    - signal: DAC_CHX_TRG15
      source: PLAY1_OUT12
