block/COMP:
  description: Comparator.
  items:
  - name: SR
    description: Comparator status register.
    byte_offset: 0
    fieldset: SR
  - name: ICFR
    description: Comparator interrupt clear flag register.
    byte_offset: 4
    fieldset: ICFR
  - name: CFGR
    description: Comparator configuration register.
    array:
      len: 2
      stride: 4
    byte_offset: 12
    fieldset: CFGR
fieldset/CFGR:
  description: Comparator configuration register.
  fields:
  - name: EN
    description: COMP Channel enable This bit is set and cleared by software (only if LOCK not set). It enables the COMP-Channel.
    bit_offset: 0
    bit_size: 1
  - name: BRGEN
    description: Scaler bridge enable This bit is set and cleared by software (only if LOCK not set). This bit enables the bridge of the scaler. If SCALEN is set and BRGEN is reset, all four scaler outputs provide the same level V<sub>REF_COMP</sub> (similar to V<sub>REFINT</sub>). If SCALEN and BRGEN are set, the four scaler outputs provide V<sub>REF_COMP</sub>, 3/4-V<sub>REF_COMP</sub>, 1/2-V<sub>REF_COMP</sub> and 1/4-V<sub>REF_COMP</sub> levels, respectively.
    bit_offset: 1
    bit_size: 1
  - name: SCALEN
    description: Voltage scaler enable This bit is set and cleared by software (only if LOCK not set). This bit enables the V<sub>REFINT</sub> scaler for the COMP channels.
    bit_offset: 2
    bit_size: 1
  - name: POLARITY
    description: COMP channel polarity selection This bit is set and cleared by software (only if LOCK not set). It inverts COMP channel polarity.
    bit_offset: 3
    bit_size: 1
  - name: WINMODE
    description: Window mode. Selects the signal on the non-inverting input.
    bit_offset: 4
    bit_size: 1
  - name: ITEN
    description: COMP channel interrupt enable This bit is set and cleared by software (only if LOCK not set). This bit enable the interrupt generation of the COMP channel.
    bit_offset: 6
    bit_size: 1
  - name: HYST
    description: COMP channel hysteresis selection These bits are set and cleared by software (only if LOCK not set). They select the hysteresis voltage of the COMP channel.
    bit_offset: 8
    bit_size: 2
    enum: HYST
  - name: PWRMODE
    description: Power mode of the COMP channel These bits are set and cleared by software (only if LOCK not set). They control the power/speed of the COMP channel.
    bit_offset: 12
    bit_size: 2
    enum: PWRMODE
  - name: WINOUT
    description: COMP output selector.
    bit_offset: 14
    bit_size: 1
  - name: INMSEL
    description: 'COMP channel inverting input selection These bits are set and cleared by software (only if LOCK not set). They select which input is connected to the input minus of the COMP channel. Note: See Table-146: COMP1 inverting input assignment for more details.'
    bit_offset: 16
    bit_size: 4
    enum: INMSEL
  - name: INPSEL0
    description: 'COMP noninverting input selection This bit is set and cleared by software (only if LOCK not set). They select which input is connected to the positive input of COMP channel. Note: See Table-145: COMP1 noninverting input assignment for more details.'
    bit_offset: 20
    bit_size: 1
  - name: INPSEL1
    description: 'COMP noninverting input selection This bit is set and cleared by software (only if LOCK not set). They select which input is connected to the positive input of the COMP channel. See Table-145: COMP1 noninverting input assignment for more details.'
    bit_offset: 22
    bit_size: 1
  - name: BLANKING
    description: 'COMP Channel blanking source selection Bits of this field are set and cleared by software (only if LOCK not set). The field selects the input source for COMP Channel output blanking: All other values: reserved.'
    bit_offset: 24
    bit_size: 4
    enum: BLANKING
  - name: LOCK
    description: Lock This bit is set by software and cleared by a hardware system reset. It locks the whole content of the COMP Channel configuration register COMP_CFGR1[31:0].
    bit_offset: 31
    bit_size: 1
fieldset/ICFR:
  description: Comparator interrupt clear flag register.
  fields:
  - name: CCIF
    description: Clear COMP Channel interrupt flag Writing 1 clears the C1IF flag in the COMP_SR register.
    bit_offset: 16
    bit_size: 1
    array:
      len: 2
      stride: 1
fieldset/SR:
  description: Comparator status register.
  fields:
  - name: CVAL
    description: COMP Channel output status bit This bit is read-only. It reflects the current COMP Channel output taking into account POLARITY and BLANKING bits effect.
    bit_offset: 0
    bit_size: 1
    array:
      len: 2
      stride: 1
  - name: CIF
    description: COMP Channel interrupt flag This bit is set by hardware when the COMP Channel output is set This bit is cleared by software writing 1 the CC1IF bit in the COMP_ICFR register.
    bit_offset: 16
    bit_size: 1
    array:
      len: 2
      stride: 1
enum/BLANKING:
  bit_size: 4
  variants:
  - name: NoBlanking
    value: 0
  - name: Tim1Oc5
    value: 1
  - name: Tim2Oc3
    value: 2
  - name: Tim3Oc3
    value: 3
  - name: Tim3Oc4
    value: 4
  - name: Lptim1Ch2
    value: 5
  - name: Lptim2Ch2
    value: 6
enum/HYST:
  bit_size: 2
  variants:
  - name: None
    value: 0
  - name: Low
    value: 1
  - name: Medium
    value: 2
  - name: High
    value: 3
enum/INMSEL:
  bit_size: 4
  variants:
  - name: VRef_1over4
    value: 0
  - name: VRef_1over2
    value: 1
  - name: VRef_3over4
    value: 2
  - name: VRef
    value: 3
  - name: Dac1Out1
    value: 4
  - name: Inm1
    value: 5
  - name: Inm2
    value: 6
  - name: Inm3
    value: 7
  - name: VSense
    value: 8
  - name: VBat_1over4
    value: 9
enum/PWRMODE:
  bit_size: 2
  variants:
  - name: High
    description: High speed / full power
    value: 0
  - name: Medium
    description: Medium speed / medium power
    value: 1
  - name: MediumEither
    description: Medium speed / medium power
    value: 2
  - name: Low
    description: Ultra low power / ultra-low-power
    value: 3
